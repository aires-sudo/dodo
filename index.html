<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>松鼠的蘋果籃</title>
  <style>
    :root{--ink:#3d2940;--pink:#ff8eaa;--cream:#fff8e9;--green:#91c96d;--brown:#81523e}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(#bcecff 0 70%,#b8df7d 70%);display:grid;place-items:center;overflow:hidden}
    .wrap{width:min(94vw,760px);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-size:clamp(1.35rem,4vw,2rem);font-weight:900;letter-spacing:.05em;text-shadow:2px 2px #fff}.stats{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fffdf7;border:3px solid var(--ink);border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
    #game{position:relative;height:min(70vh,560px);min-height:430px;border:5px solid var(--ink);border-radius:28px;background:linear-gradient(#8cdbff 0 72%,#83c660 72%);overflow:hidden;box-shadow:8px 8px 0 rgba(61,41,64,.2)}
    .sun{position:absolute;right:8%;top:7%;font-size:4rem;filter:drop-shadow(3px 3px #fff)}.cloud{position:absolute;font-size:3rem;opacity:.85}.c1{left:8%;top:9%}.c2{left:56%;top:20%;font-size:2.5rem}.tree{position:absolute;left:4%;bottom:25%;font-size:7rem;line-height:1;filter:drop-shadow(4px 4px #5c3935)}.branch{position:absolute;left:14%;top:26%;font-size:2.4rem;transform:rotate(-8deg)}.squirrel{position:absolute;top:7%;left:50%;transform:translateX(-50%);font-size:4.2rem;z-index:3;animation:bob 1.5s infinite ease-in-out}.hint{position:absolute;top:3%;left:50%;transform:translateX(-50%);font-weight:900;background:#fff8e9;border:3px solid var(--ink);padding:5px 12px;border-radius:20px;white-space:nowrap;z-index:4}.item{position:absolute;font-size:2.35rem;z-index:2;transition:none;filter:drop-shadow(2px 2px rgba(61,41,64,.25))}.player{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-size:4.2rem;z-index:5;transition:left .06s linear}.basket{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);font-size:3rem;z-index:4}.ground{position:absolute;bottom:0;width:100%;height:25%;background:repeating-linear-gradient(75deg,transparent 0 28px,rgba(55,124,64,.3) 29px 33px);pointer-events:none}
    .controls{display:flex;gap:10px;justify-content:center;margin-top:14px}.btn{font:inherit;font-weight:900;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;background:#fffdf7;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.primary{background:var(--pink)}.touch{display:none}.overlay{position:absolute;inset:0;background:rgba(61,41,64,.72);display:grid;place-items:center;z-index:10}.card{background:var(--cream);border:4px solid var(--ink);border-radius:24px;padding:28px;text-align:center;max-width:88%;box-shadow:7px 7px 0 var(--ink)}.card h1{margin:0 0 8px;font-size:2rem}.card p{margin:8px 0 18px;line-height:1.6}.hidden{display:none!important}@keyframes bob{50%{transform:translate(-50%,5px)}}
    @media(max-width:560px){.top{align-items:flex-start;gap:8px;flex-direction:column}.stats{justify-content:flex-start}.touch{display:flex;position:absolute;bottom:12px;left:0;right:0;justify-content:space-between;padding:0 18px;z-index:8}.touch button{width:64px;height:52px;border-radius:16px;border:3px solid var(--ink);background:#fff8e9;font-size:1.5rem;font-weight:900}.tree{font-size:5.5rem}.squirrel{font-size:3.4rem}.player{font-size:3.5rem}.basket{font-size:2.4rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div class="brand">🐿️ 松鼠的蘋果籃</div><div class="stats"><div class="pill">🍎 分數 <span id="score">0</span></div><div class="pill">💗 <span id="hearts">❤️❤️❤️</span></div></div></div>
    <section id="game" aria-label="接蘋果遊戲">
      <div class="sun">☀️</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="tree">🌳</div><div class="branch">🍎 🌰 🍎</div><div class="squirrel">🐿️</div><div class="hint">← → / A D 移動</div>
      <div id="item" class="item hidden"></div><div id="player" class="player">🧑‍🌾</div><div id="basket" class="basket">🧺</div><div class="ground"></div>
      <div class="touch"><button id="leftBtn" aria-label="向左">◀</button><button id="rightBtn" aria-label="向右">▶</button></div>
      <div id="overlay" class="overlay"><div class="card"><h1 id="title">準備接蘋果！</h1><p id="message">蘋果接到得分，刺刺栗子要小心！<br>漏掉蘋果或接到栗子都會失去一顆心。</p><button class="btn primary" id="startBtn">開始遊戲</button></div></div>
    </section>
    <div class="controls"><button class="btn primary" id="restartBtn">↻ 重新開始</button></div>
  </main>
  <script>
    const game=document.querySelector('#game'), player=document.querySelector('#player'), basket=document.querySelector('#basket'), item=document.querySelector('#item'), overlay=document.querySelector('#overlay'), scoreEl=document.querySelector('#score'), heartsEl=document.querySelector('#hearts'), startBtn=document.querySelector('#startBtn'), restartBtn=document.querySelector('#restartBtn');
    let x=.5, score=0, hearts=3, running=false, raf, last=0, dropTimer=0, current=null, keys={};
    function reset(){x=.5;score=0;hearts=3;current=null;scoreEl.textContent=0;heartsEl.textContent='❤️❤️❤️';player.style.left='50%';basket.style.left='50%';item.classList.add('hidden');}
    function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}
    function end(){running=false;cancelAnimationFrame(raf);item.classList.add('hidden');overlay.classList.remove('hidden');document.querySelector('#title').textContent='遊戲結束！';document.querySelector('#message').innerHTML=`你拿到了 <b>${score}</b> 分！<br>再試一次，把蘋果全部接住吧 🍎`;startBtn.textContent='再玩一次';}
    function spawn(){if(current)return;current={kind:Math.random()<.22?'nut':'apple',x:.12+Math.random()*.76,y:12};item.textContent=current.kind==='nut'?'🌰':'🍎';item.style.left=(current.x*100)+'%';item.style.top=current.y+'%';item.classList.remove('hidden')}
    function loop(t){if(!running)return;const dt=Math.min(40,t-last);last=t;dropTimer+=dt;if(dropTimer>650){dropTimer=0;spawn()}if(keys.left)x-=dt*.00055;if(keys.right)x+=dt*.00055;x=Math.max(.08,Math.min(.92,x));player.style.left=(x*100)+'%';basket.style.left=(x*100)+'%';if(current){current.y+=dt*.018;item.style.top=current.y+'%';const close=current.y>78&&current.y<94&&Math.abs(current.x-x)<.17;if(close){if(current.kind==='apple'){score++;scoreEl.textContent=score}else lose();clearItem()}else if(current.y>96){if(current.kind==='apple')lose();clearItem()}}raf=requestAnimationFrame(loop)}
    function clearItem(){current=null;item.classList.add('hidden')};function lose(){hearts--;heartsEl.textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);if(hearts<=0)end()}
    addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
    function hold(btn,dir){btn.onpointerdown=()=>keys[dir]=true;btn.onpointerup=btn.onpointerleave=()=>keys[dir]=false}hold(document.querySelector('#leftBtn'),'left');hold(document.querySelector('#rightBtn'),'right');startBtn.onclick=start;restartBtn.onclick=start;
  </script>
</body>
</html>
